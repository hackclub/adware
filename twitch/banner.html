<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1200px;height:480px;position:relative}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1040px;padding:26px 30px 30px;
  display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:center}
.panel img{width:300px;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.box{padding:22px 26px}
.box h1{margin:0 0 8px;font:normal 54px/1 var(--slab);letter-spacing:.02em;color:var(--red);text-transform:uppercase;text-shadow:3px 3px 0 #000}
.box p{margin:0;font:bold 24px/1.3 Arial,sans-serif;color:#000}
.box p b{color:var(--red)}
.box .url{display:block;margin-top:10px;font:bold italic 24px/1 Arial,sans-serif;color:#000}
</style>
<div class="bg"></div>
<div class="panel">
  <img src="../logo.svg">
  <div class="box">
    <h1>You&rsquo;ve been chosen to design a sticker!</h1>
    <p>Ship a project, log your coding hours, spend them on sticker space. <b>Printed, cut and stuck to my laptop live on stream.</b></p>
    <span class="url">adware.hackclub.com</span>
  </div>
</div>
