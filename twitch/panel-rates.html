<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:320px;height:150px;position:relative;background:var(--bg)}
.panel{position:absolute;inset:0;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;box-shadow:none}
.tier{margin:0;text-align:center}
.tier img{width:100%;height:auto;display:block;border:1px solid rgba(0,0,0,.5)}
.tier b{display:block;margin-top:5px;font:normal 20px/1 var(--slab);color:var(--red);text-shadow:1.5px 1.5px 0 #000;letter-spacing:.02em}
</style>
<div class="panel">
  <figure class="tier"><img src="../tier-small.webp"><b>2 HOURS</b></figure>
  <figure class="tier"><img src="../tier-medium.webp"><b>3 HOURS</b></figure>
  <figure class="tier"><img src="../tier-large.webp"><b>5 HOURS</b></figure>
</div>
