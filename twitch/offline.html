<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body{width:1920px;height:1080px;position:relative}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1400px;padding:44px 44px 50px;text-align:center}
.panel img{width:440px;height:auto;display:block;margin:0 auto 30px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.box{padding:34px 40px}
.box h1{margin:0 0 14px;font:normal 118px/1 var(--slab);letter-spacing:.02em;color:var(--red);text-transform:uppercase;text-shadow:5px 5px 0 #000}
.box p{margin:0;font:bold 36px/1.35 Arial,sans-serif;color:#000}
.box p.when{color:var(--red);font-style:italic;margin-top:8px}
.box .url{display:block;margin-top:22px;font:normal 54px/1 var(--slab);letter-spacing:.03em;color:#000}
</style>
<div class="bg"></div>
<div class="panel">
  <img src="../logo.svg">
  <div class="box">
    <h1>Stream offline</h1>
    <p>You&rsquo;ve been chosen to design a sticker! Ship a project, log your coding hours, spend them on sticker space. Printed, cut and stuck to my laptop live on stream.</p>
    <p class="when">Live for 24 hours: Tue 9 Sep 17:00 EDT to Wed 10 Sep 17:00 EDT</p>
    <span class="url">adware.hackclub.com</span>
  </div>
</div>
